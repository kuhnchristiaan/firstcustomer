name: Application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: firstcustomers_test
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U firstcustomers_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://firstcustomers_test@127.0.0.1:55439/postgres
      TEST_DATABASE_URL: postgresql://firstcustomers_test@127.0.0.1:55439/postgres
      APP_URL: http://localhost:3000
      NEON_AUTH_BASE_URL: https://auth.example.invalid/auth
      NEON_AUTH_COOKIE_SECRET: ci-placeholder-only-at-least-32-characters
      MOCK_ANALYSIS: "false"
      GUEST_ANALYSIS_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm test -- --maxWorkers=1
      - run: npm run build
      - run: npm run typecheck
